<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLV Music Bot — Koneksi Terputus</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="titlebar">
    <div class="titlebar-title">
      <i class="fa-solid fa-music"></i>
      <span>CLV Music Bot Client</span>
    </div>
    <div class="titlebar-actions">
      <button class="titlebar-btn" onclick="window.desktopApp.minimizeWindow()" title="Minimize">
        <i class="fa-solid fa-minus"></i>
      </button>
      <button class="titlebar-btn" onclick="window.desktopApp.maximizeWindow()" title="Maximize">
        <i class="fa-regular fa-square"></i>
      </button>
      <button class="titlebar-btn close" onclick="window.desktopApp.closeWindow()" title="Close">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
  </div>

  <div class="app-container" style="margin-top: 20px;">
    <div class="error-icon">
      <i class="fa-solid fa-triangle-exclamation"></i>
    </div>

    <h1 class="app-title">Koneksi Server Terputus</h1>
    <p class="app-subtitle">Tidak dapat terhubung ke backend hosting HidenCloud atau server sedang offline/restarting.</p>

    <div class="error-details" id="error-details">
      Error: ERR_CONNECTION_REFUSED
    </div>

    <button type="button" class="btn-primary" id="btn-retry" onclick="handleRetry()">
      <i class="fa-solid fa-rotate-right"></i>
      <span>Coba Hubungkan Kembali</span>
    </button>

    <button type="button" class="btn-secondary" onclick="handleChangeServer()">
      <i class="fa-solid fa-gear"></i>
      <span>Ganti URL Server</span>
    </button>

    <div class="app-footer">
      CLV Music Bot Desktop Client • v1.0.0
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const errorDesc = urlParams.get('error') || 'Gagal menghubungi server';
    const targetUrl = urlParams.get('url') || '';

    const errorDetailsEl = document.getElementById('error-details');
    errorDetailsEl.textContent = `Target: ${targetUrl || 'Unknown'}\nDetail: ${errorDesc}`;

    function handleRetry() {
      const btn = document.getElementById('btn-retry');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span>Mencoba kembali...</span>';
      
      if (window.desktopApp && window.desktopApp.reloadPage) {
        window.desktopApp.reloadPage();
      } else {
        window.location.reload();
      }
    }

    function handleChangeServer() {
      if (window.desktopApp && window.desktopApp.openConnectScreen) {
        window.desktopApp.openConnectScreen();
      }
    }
  </script>
</body>
</html>
