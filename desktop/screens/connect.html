<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLV Music Bot — Hubungkan ke Server</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="titlebar">
    <div class="titlebar-title">
      <i class="fa-solid fa-music"></i>
      <span>CLV Music Bot Client</span>
    </div>
    <div class="titlebar-actions">
      <button class="titlebar-btn" onclick="window.desktopApp.minimizeWindow()" title="Minimize">
        <i class="fa-solid fa-minus"></i>
      </button>
      <button class="titlebar-btn" onclick="window.desktopApp.maximizeWindow()" title="Maximize">
        <i class="fa-regular fa-square"></i>
      </button>
      <button class="titlebar-btn close" onclick="window.desktopApp.closeWindow()" title="Close">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
  </div>

  <div class="app-container" style="margin-top: 20px;">
    <div class="app-logo">
      <i class="fa-solid fa-headphones-simple"></i>
    </div>

    <h1 class="app-title">CLV Music Bot</h1>
    <p class="app-subtitle">Native Desktop Client untuk Web Panel &amp; Bot yang di-hosting di HidenCloud</p>

    <form id="connect-form" onsubmit="handleConnect(event)">
      <div class="form-group">
        <label class="form-label" for="server-url">URL Server / Domain Bot</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-globe input-icon"></i>
          <input 
            type="url" 
            id="server-url" 
            class="form-input" 
            placeholder="https://bot-domain.hidencloud.com" 
            required 
            autocomplete="off"
            spellcheck="false"
          >
        </div>
      </div>

      <div class="info-box">
        <i class="fa-solid fa-circle-info"></i>
        <div>
          Masukkan URL hosting HidenCloud atau domain Web Panel Anda. URL ini akan tersimpan otomatis di komputer Anda.
        </div>
      </div>

      <button type="submit" class="btn-primary" id="btn-submit">
        <i class="fa-solid fa-plug"></i>
        <span>Hubungkan ke Server</span>
      </button>

      <div class="status-msg" id="status-msg"></div>
    </form>

    <div class="app-footer">
      CLV Music Bot Desktop Client • v1.0.0
    </div>
  </div>

  <script>
    const serverUrlInput = document.getElementById('server-url');
    const submitBtn = document.getElementById('btn-submit');
    const statusMsg = document.getElementById('status-msg');

    // Muat URL yang sudah tersimpan sebelumnya (jika ada)
    window.addEventListener('DOMContentLoaded', async () => {
      if (window.desktopApp && window.desktopApp.getServerUrl) {
        try {
          const currentUrl = await window.desktopApp.getServerUrl();
          if (currentUrl) {
            serverUrlInput.value = currentUrl;
          }
        } catch (e) {
          console.error(e);
        }
      }
      serverUrlInput.focus();
    });

    async function handleConnect(e) {
      e.preventDefault();
      let url = serverUrlInput.value.trim();

      if (!url) {
        setStatus('Mohon masukkan URL server Anda.', 'error');
        return;
      }

      // Pastikan ada protokol http/https
      if (!/^https?:\/\//i.test(url)) {
        url = 'https://' + url;
        serverUrlInput.value = url;
      }

      // Bersihkan trailing slash
      url = url.replace(/\/+$/, '');

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span>Menghubungkan...</span>';
      setStatus('Menguji koneksi ke server HidenCloud...', 'info');

      try {
        if (window.desktopApp && window.desktopApp.setServerUrl) {
          const testRes = await window.desktopApp.testConnection(url);
          if (testRes.success) {
            setStatus('Berhasil terhubung! Membuka dashboard...', 'success');
            await window.desktopApp.setServerUrl(url);
          } else {
            setStatus(testRes.error || 'Server tidak merespons. Pastikan URL benar & server online.', 'error');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fa-solid fa-plug"></i> <span>Hubungkan ke Server</span>';
          }
        }
      } catch (err) {
        setStatus('Gagal terhubung: ' + err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-plug"></i> <span>Hubungkan ke Server</span>';
      }
    }

    function setStatus(msg, type = 'info') {
      statusMsg.className = 'status-msg ' + type;
      let icon = 'fa-circle-info';
      if (type === 'error') icon = 'fa-triangle-exclamation';
      if (type === 'success') icon = 'fa-circle-check';
      statusMsg.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${msg}</span>`;
    }
  </script>
</body>
</html>
